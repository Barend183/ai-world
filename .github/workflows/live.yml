# Checks every hour whether the AI wants to wake up (it chooses its own sleep), on GitHub's free servers, then saves what it did.
name: Live

on:
  schedule:
    - cron: "17 * * * *"     # every hour GitHub checks whether he wants to be awake; he chooses when
                              # (Gemini's free tier, 20 requests per model per day, is his thinking budget)
  workflow_dispatch:          # the "Run workflow" button wakes it up right now
    inputs:
      wake:
        description: "Wake him now? (no = just check whether he wants to be awake, like the hourly check)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      alarm_test:
        description: "Test his alarm clock: ring after this many minutes instead (it only checks; he still wakes when he chose)"
        required: false
        default: ""
  push:
    paths: ["docs/vault/inbox/**"]   # a note you send from his page wakes him right away

permissions:
  contents: write             # save its books and journal
  issues: write               # read and answer your notes

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    concurrency:              # one waking at a time (on the job, so a sleeping alarm never holds up a note)
      group: live
      cancel-in-progress: false
    outputs:
      wake_after: ${{ steps.bed.outputs.wake_after }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}  # his latest world, not the commit that triggered this run: a run waiting
                                       # its turn must start from the save the run before it just made
          persist-credentials: false   # no saved token in the folder that his programs could use

      # His workshop programs run as this separate, powerless user: it can't read the keys or push to GitHub.
      - name: Set up the workshop's locked-down user
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin sprout
          chmod o+x "$HOME" "$HOME/work" "$(dirname "$GITHUB_WORKSPACE")"
          chmod o+rx "$GITHUB_WORKSPACE" docs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the PDF reader and the lock
        run: pip install --quiet -r requirements.txt

      # His world is stored encrypted in the public repository; it's only opened here, on this throwaway server.
      - name: Unlock his world
        env:
          WORLD_PASSWORD: ${{ secrets.WORLD_PASSWORD }}
          WORLD_PASSWORD_NEW: ${{ secrets.WORLD_PASSWORD_NEW }}
          WORLD_PASSWORD_OLD: ${{ secrets.WORLD_PASSWORD_OLD }}   # only while changing the password
        run: |
          python -m brain unlock
          # his workshop folder is shared: his programs (the locked-down user) and his saved tools both live there
          mkdir -p docs/world/workshop/tools
          chmod o+rx docs/world
          sudo chmod -R a+rwX docs/world/workshop

      # His own brain: a small open model that runs right here and grows from his lessons (see grow.yml).
      # Only started when he's actually going to wake up.
      - name: Will he wake?
        id: due
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.wake != 'no' }}" = "true" ] || python -m brain due; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the open-source brains from cache
        if: steps.due.outputs.yes == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ hashFiles('config.json', 'brain/own_brain.json') }}

      - name: Start his own brain
        if: steps.due.outputs.yes == 'true'
        continue-on-error: true   # without it he simply thinks with his other brains
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python -c "import json,sys; sys.exit(0 if json.load(open('config.json')).get('own_brain',{}).get('enabled') else 1)" || exit 0
          curl -fsSL https://ollama.com/install.sh | sh > /dev/null
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull "$(python -c "import json; print(json.load(open('config.json'))['own_brain']['base'])")" > /dev/null
          # the version that has grown from his lessons, once there is one (kept as a private Kaggle dataset)
          if [ -f brain/own_brain.json ] && [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY$KAGGLE_API_TOKEN" ] && ! ollama list | grep -q '^sprout'; then
            pip install --quiet kaggle six
            kaggle datasets download "$KAGGLE_USERNAME/sprout-brain" -p "$HOME/sprout" --unzip -q \
              && (cd "$HOME/sprout" && ollama create sprout -f Modelfile > /dev/null) || echo "couldn't fetch his grown brain this time"
          fi
          ollama list

      - name: Wake up
        id: wake
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER }}
          WORLD_PASSWORD: ${{ secrets.WORLD_PASSWORD }}
          WORLD_PASSWORD_NEW: ${{ secrets.WORLD_PASSWORD_NEW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WISHES_KEY: ${{ secrets.WISHES_KEY }}   # seals only his waiting wishes, for the weekly builder
        run: python -m brain run --next-wake 180 ${{ github.event_name == 'workflow_dispatch' && inputs.wake != 'no' && '--now' || '' }}

      # Only when every free service is used up for the day: run a free open model (Gemma 3) right here instead.
      # It's slower and simpler, but unlimited, so he never has to stop.
      - name: Start the open-source brain
        if: steps.wake.outputs.needs_local == 'true'
        run: |
          if ! curl -s localhost:11434/api/tags > /dev/null; then   # not already running for his own brain
            command -v ollama > /dev/null || curl -fsSL https://ollama.com/install.sh | sh
            sudo systemctl stop ollama || true
            OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > /tmp/ollama.log 2>&1 &
            for i in $(seq 1 30); do curl -s localhost:11434/api/tags > /dev/null && break; sleep 1; done
          fi
          ollama pull "$(python -c "import json; print(json.load(open('config.json'))['ollama']['model'])")"

      - name: Wake up (open-source brain)
        if: steps.wake.outputs.needs_local == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          WORLD_PASSWORD: ${{ secrets.WORLD_PASSWORD }}
          WORLD_PASSWORD_NEW: ${{ secrets.WORLD_PASSWORD_NEW }}
        run: python -m brain run --next-wake 180 ${{ github.event_name == 'workflow_dispatch' && inputs.wake != 'no' && '--now' || '' }}

      # When he wants to be up again, for his alarm clock below (just a time; the logs already show it)
      - name: Note when he wants to wake
        id: bed
        run: |
          python - <<'EOF'
          import json, os
          try:
              when = json.load(open("docs/world/self.json")).get("wake_after") or ""
          except Exception:
              when = ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"wake_after={when}\n")
          EOF

      - name: Lock his world again and save it
        run: |
          python -m brain lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/vault docs/public
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "His world, $(date -u +'%Y-%m-%d %H:%M') UTC"
          # the token is used only here, after his session has finished
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull -q --rebase "$REMOTE" "${GITHUB_REF_NAME}" && git push -q "$REMOTE" "HEAD:${GITHUB_REF_NAME}"
        env:
          WORLD_PASSWORD: ${{ secrets.WORLD_PASSWORD }}
          WORLD_PASSWORD_NEW: ${{ secrets.WORLD_PASSWORD_NEW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # His alarm clock. GitHub's hourly schedule is best-effort and often skipped, so after he goes to bed this
  # waits until the time he chose and then starts a check, which GitHub always runs. If anything else wakes
  # him first (a note), that newer run sets its own alarm and this one quietly steps aside.
  alarm:
    needs: live
    if: needs.live.outputs.wake_after != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355      # a job can last 6 hours at most; a longer sleep is bridged by a check that sets the next alarm
    permissions:
      actions: write          # only this job may start the workflow; his session never gets this
    steps:
      - name: Wait until he wants to wake, then ring
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKE: ${{ needs.live.outputs.wake_after }}
          MINE: ${{ github.run_id }}
          TEST: ${{ inputs.alarm_test }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live.yml"
          now=$(date +%s)
          ring=$(( $(date -d "$WAKE" +%s) + 60 ))
          [ "$ring" -lt $(( now + 1800 )) ] && ring=$(( now + 1800 ))     # never ring sooner than his shortest sleep
          [ "$ring" -gt $(( now + 20400 )) ] && ring=$(( now + 20400 ))   # 5h40m: a check then sets the rest
          TEST="${TEST//[^0-9]/}"
          if [ -n "$TEST" ]; then ring=$(( now + TEST * 60 )); echo "(a test ring)"; fi
          echo "alarm set for $(date -u -d "@$ring" +%H:%M) UTC"
          while [ "$(date +%s)" -lt "$ring" ]; do
            left=$(( ring - $(date +%s) ))
            sleep $(( left < 600 ? left : 600 ))
            latest=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API/runs?per_page=1" \
              | python3 -c "import json,sys; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['id'] if r else '')" || echo "$MINE")
            if [ -n "$latest" ] && [ "$latest" != "$MINE" ]; then echo "a newer run keeps his alarm now"; exit 0; fi
          done
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/dispatches" \
            -d "{\"ref\": \"${GITHUB_REF_NAME}\", \"inputs\": {\"wake\": \"no\"}}"
          echo "rang his alarm"
